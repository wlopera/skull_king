<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <defs>
    <linearGradient id="bg_TIGRESS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#381203" />
      <stop offset="50%" stop-color="#5e2409" />
      <stop offset="100%" stop-color="#1f0902" />
    </linearGradient>
  </defs>

  <!-- Borde y Fondo -->
  <rect x="2" y="2" width="196" height="276" rx="10" fill="url(#bg_TIGRESS)" stroke="#ea580c" stroke-width="3" />
  <rect x="8" y="8" width="184" height="264" rx="8" fill="none" stroke="#ea580c" stroke-width="1" stroke-dasharray="4 2" opacity="0.4" />

  <!-- Esquina Superior Izquierda -->
  <text x="16" y="36" font-family="'Cinzel', serif, Georgia" font-size="24" font-weight="900" fill="#f97316">🐯</text>
  <text x="52" y="34" font-size="20">⚔️</text>

  <!-- Arte Central -->
  <g transform="translate(50, 68) scale(1.0)">
    
      <circle cx="50" cy="50" r="34" fill="none" stroke="#f97316" stroke-width="3" />
      <path d="M 50 16 A 34 34 0 0 0 50 84 Z" fill="rgba(255, 255, 255, 0.1)" />
      <path d="M 50 16 A 34 34 0 0 1 50 84 Z" fill="rgba(220, 38, 38, 0.15)" />
      <path d="M 30 42 Q 50 24 70 42 Q 50 36 30 42 Z" fill="#292524" stroke="#f97316" stroke-width="2" />
      <path d="M 64 36 Q 78 20 84 14 Q 76 28 66 38 Z" fill="#fb923c" />
      <circle cx="50" cy="55" r="15" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5" />
      <ellipse cx="44" cy="53" rx="3.5" ry="4.5" fill="#15803d" />
      <ellipse cx="56" cy="53" rx="3.5" ry="4.5" fill="#15803d" />
    
  </g>

  <!-- Esquina Inferior Derecha (Invertida) -->
  <g transform="rotate(180 100 140)">
    <text x="16" y="36" font-family="'Cinzel', serif, Georgia" font-size="24" font-weight="900" fill="#f97316">🐯</text>
    <text x="52" y="34" font-size="20">⚔️</text>
  </g>

  <!-- Banner con Nombre del Personaje -->
  <rect x="15" y="246" width="170" height="22" rx="4" fill="rgba(5, 11, 20, 0.95)" stroke="#ea580c" stroke-width="1.5" />
  <text x="100" y="261" font-family="'Cinzel', serif, Georgia" font-size="9" font-weight="900" fill="#f97316" text-anchor="middle" letter-spacing="1">TIGRESA (PIRATA / HUIDA)</text>
</svg>