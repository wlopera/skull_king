<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <defs>
    <linearGradient id="bg_WHITE_WHALE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2744" />
      <stop offset="50%" stop-color="#18426d" />
      <stop offset="100%" stop-color="#081728" />
    </linearGradient>
  </defs>

  <!-- Borde y Fondo -->
  <rect x="2" y="2" width="196" height="276" rx="10" fill="url(#bg_WHITE_WHALE)" stroke="#38bdf8" stroke-width="3" />
  <rect x="8" y="8" width="184" height="264" rx="8" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 2" opacity="0.4" />

  <!-- Esquina Superior Izquierda -->
  <text x="16" y="36" font-family="'Cinzel', serif, Georgia" font-size="24" font-weight="900" fill="#e0f2fe">🐋</text>
  <text x="52" y="34" font-size="20">🌊</text>

  <!-- Arte Central -->
  <g transform="translate(50, 68) scale(1.0)">
    
      <circle cx="50" cy="50" r="34" fill="#0f2744" stroke="#38bdf8" stroke-width="2" />
      <!-- Olas gigantes del océano -->
      <path d="M 16 68 Q 34 52 50 66 T 84 64" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.7" />
      <!-- Gran cuerpo blanco de la ballena emergiendo -->
      <path d="M 24 64 C 28 36 62 30 76 46 C 82 52 82 62 72 68 C 50 78 30 72 24 64 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
      <!-- Ojo negro brillante -->
      <circle cx="68" cy="50" r="2.5" fill="#0f172a" />
      <!-- Aleta dorsal / chorro de agua -->
      <path d="M 46 32 Q 48 20 44 16 Q 50 24 50 32" stroke="#38bdf8" stroke-width="2" fill="none" />
      <!-- Cola de la ballena en el agua -->
      <path d="M 24 64 Q 14 54 12 44 Q 18 52 24 58" fill="#e2e8f0" />
    
  </g>

  <!-- Esquina Inferior Derecha (Invertida) -->
  <g transform="rotate(180 100 140)">
    <text x="16" y="36" font-family="'Cinzel', serif, Georgia" font-size="24" font-weight="900" fill="#e0f2fe">🐋</text>
    <text x="52" y="34" font-size="20">🌊</text>
  </g>

  <!-- Banner con Nombre del Personaje -->
  <rect x="15" y="246" width="170" height="22" rx="4" fill="rgba(5, 11, 20, 0.95)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="100" y="261" font-family="'Cinzel', serif, Georgia" font-size="9" font-weight="900" fill="#e0f2fe" text-anchor="middle" letter-spacing="1">BALLENA BLANCA</text>
</svg>